<svg viewBox="0 0 520 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tan Development">
  <g transform="translate(183.3,17.64) scale(0.59)">
    <!-- roofline: monoline gable, two angled strokes meeting at a peak -->
    <path d="M54,100 L54,84 L128,24 L202,84 L202,100"
          fill="none" stroke="currentColor" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" />

    <!-- T: stem centered-left, crossbar with flared serif ends -->
    <rect x="56" y="100" width="78" height="16" fill="currentColor" />
    <rect x="50" y="96" width="18" height="24" fill="currentColor" />
    <rect x="122" y="96" width="18" height="24" fill="currentColor" />
    <rect x="88" y="100" width="16" height="94" fill="currentColor" />
    <rect x="78" y="180" width="36" height="14" fill="currentColor" />

    <!-- D: stem interlocks with T's crossbar, bowl opens to the right -->
    <rect x="122" y="100" width="18" height="94" fill="currentColor" />
    <rect x="118" y="96" width="28" height="16" fill="currentColor" />
    <rect x="118" y="178" width="28" height="16" fill="currentColor" />
    <path d="M140,100 C182,100 206,120 206,147 C206,174 182,194 140,194
             L140,178 C170,178 188,164 188,147 C188,130 170,116 140,116 Z"
          fill="currentColor" />
  </g>

  <text x="260" y="220" text-anchor="middle"
        font-family="'Fraunces', Georgia, 'Times New Roman', serif"
        font-weight="500" font-size="34" letter-spacing="9"
        fill="currentColor">TAN DEVELOPMENT</text>
</svg>
